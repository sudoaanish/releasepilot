[package]
name = "releasepilot"
version = "0.1.0"
edition = "2021"
description = "A local release-readiness checker for open-source projects"
authors = ["Aanish Farrukh"]
license = "MIT"
repository = "https://github.com/sudoaanish/ReleasePilot"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
glob = "0.3"
serde_json = "1"
regex = "1"

