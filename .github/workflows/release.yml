name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: releasepilot.exe
            archive: releasepilot-x86_64-pc-windows-msvc.zip
            raw_exe: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: releasepilot
            archive: releasepilot-x86_64-unknown-linux-gnu.tar.gz
            raw_exe: false
          - os: macos-13
            target: x86_64-apple-darwin
            binary: releasepilot
            archive: releasepilot-x86_64-apple-darwin.tar.gz
            raw_exe: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: releasepilot
            archive: releasepilot-aarch64-apple-darwin.tar.gz
            raw_exe: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package assets
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dist/${{ matrix.binary }}"
          Copy-Item "README.md" "$dist/README.md"
          Copy-Item "LICENSE" "$dist/LICENSE"

          if ("${{ matrix.raw_exe }}" -eq "true") {
            Copy-Item "$dist/${{ matrix.binary }}" "releasepilot.exe"
            Compress-Archive -Path "$dist/*" -DestinationPath "${{ matrix.archive }}" -Force
          } else {
            tar -czf "${{ matrix.archive }}" -C "$dist" "${{ matrix.binary }}" "README.md" "LICENSE"
          }

      - name: Upload archive release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

      - name: Upload raw Windows executable
        if: matrix.raw_exe == true
        uses: softprops/action-gh-release@v2
        with:
          files: releasepilot.exe
